[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-admin-commands"
version = "0.1.0"
description = "Safe, auditable execution of whitelisted Django management commands from the admin UI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Dmitry" }]
keywords = ["django", "admin", "management-commands", "operations", "audit"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["Django>=3.2"]

[project.optional-dependencies]
celery = ["celery>=5.0"]

[project.urls]
Homepage = "https://github.com/example/django-admin-commands"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.5",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pre-commit>=3.5",
    "django-stubs>=5.0",
    "celery>=5.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_admin_commands"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "SIM", "RUF", "ANN"]
# ANN401: Any неизбежен на границе с нетипизированным Django (request.user, **options).
# RUF012: ModelAdmin-атрибуты — изменяемые классовые поля по соглашению Django.
# RUF001-003: кириллица в строках и комментариях — норма для этого проекта.
ignore = ["ANN401", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/django_admin_commands/migrations/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--cov=django_admin_commands --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["src/django_admin_commands"]
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.src]
include = ["src", "demo", "tests"]

[tool.ty.terminal]
# Предупреждения тоже валят проверку: иначе «нетипизированный мусор» проезжает.
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
